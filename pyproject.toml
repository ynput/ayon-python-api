[project]
name = "ayon_python_api"
version = "1.2.25-dev"
description = "AYON Python API"
license = {file = "LICENSE"}
readme = {file = "README.md", content-type = "text/markdown"}
authors = [
    {name = "ynput.io", email = "info@ynput.io"}
]
keywords = ["AYON", "ynput", "OpenPype", "vfx"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "requests >= 2.27.1",
    "Unidecode >= 1.3.0",
    "websocket-client >= 1.7.0",
]

[project.urls]
Repository = "https://github.com/ynput/ayon-python-api"
Changelog = "https://github.com/ynput/ayon-python-api/releases"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ayon_api", "ayon_api._api_helpers"]

[dependency-groups]
dev = [
    "mock",
    "pytest>=6.2.5,<7",
    "pydocstyle>=6.3.0",
]
